allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
    configurations.configureEach {
        resolutionStrategy {
            force 'pl.droidsonroids.gif:android-gif-drawable:1.2.25'
        }
    }
}

// Disable lintVital on plugins — prevents corrupt-cache MD5 failures under AGP 8.9
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it.name.toLowerCase().contains('lintvital') }.each { it.enabled = false }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
