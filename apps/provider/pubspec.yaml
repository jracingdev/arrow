name: provider
description: "Arrow Prestador On Demand"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  arrow_shared:
    path: ../shared
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10
  file_picker: ^8.3.7
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  get: ^4.7.3
  flutter_easyloading: ^3.0.5
  flutter_local_notifications: ^21.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/provider-icon-1024.png"
  adaptive_icon_background: "#111827"
  adaptive_icon_foreground: "assets/provider-icon-1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/arrow-icon.png
    - assets/provider-icon-1024.png
    - assets/provider-logo.png
    - assets/provider-logo-square.png
    - assets/audio/
    - assets/fonts/
  fonts:
    - family: EssentialSans
      fonts:
        - asset: assets/fonts/essential_sans_regular.otf
          weight: 400
        - asset: assets/fonts/essential_sans_medium.otf
          weight: 500
        - asset: assets/fonts/essential_sans_semi_bold.otf
          weight: 600
        - asset: assets/fonts/essential_sans_bold.otf
          weight: 700
